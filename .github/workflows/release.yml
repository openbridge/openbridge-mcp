name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version type (patch, minor, major)
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openbridge-mcp
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned uv
        run: pipx install uv==0.12.17

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine version bump
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          message = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%B"], text=True
          ).strip()
          if re.search(r"\bBREAKING CHANGE\b|^feat!:", message, re.IGNORECASE):
              bump = "major"
          elif message.startswith(("feat:", "feat(")):
              bump = "minor"
          elif message.startswith(("fix:", "fix(")):
              bump = "patch"
          else:
              bump = os.environ.get("INPUT_VERSION") or "patch"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"bump_type={bump}\n")
          PY

      - name: Bump project version
        id: new_version
        env:
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
        run: |
          uv version --bump "$BUMP_TYPE" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          python - <<'PY'
          import subprocess

          try:
              last_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0"], text=True
              ).strip()
              revision = f"{last_tag}..HEAD"
          except subprocess.CalledProcessError:
              revision = "HEAD"
          commits = subprocess.check_output(
              ["git", "log", revision, "--pretty=format:* %s (%h)"], text=True
          ).strip()
          with open("changelog.md", "w", encoding="utf-8") as changelog:
              changelog.write("## What's Changed\n\n")
              changelog.write(commits)
              changelog.write("\n")
          PY

      - name: Build distributions
        run: uv build --build-constraints build-constraints.txt

      - name: Commit version bump
        run: |
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }} [skip ci]"
          git push origin main

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: Release v${{ steps.new_version.outputs.version }}
          body_path: changelog.md
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
