[build-system]
requires = [ "setuptools>=45", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "openbridge-mcp"
version = "0.3.5"
description = "FastMCP server for Openbridge API integration"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [ "fastmcp[code-mode,tasks]>=3.1.0", "python-dotenv", "requests", "pydantic", "PyJWT",]

[project.optional-dependencies]
dev = [ "pytest>=7.0", "pytest-asyncio>=0.21", "responses>=0.23", "pytest-httpx>=0.21", "ruff>=0.1.0", "jsonschema>=4.0",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "src*",]
