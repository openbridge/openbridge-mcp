
services:
  caddy:
    # TLS terminator + reverse proxy. Caddy provisions a Let's Encrypt
    # certificate for ${MCP_DOMAIN} on first start (HTTP-01 challenge on
    # port 80) and auto-renews. The cert + ACME account state live on a
    # named volume so they survive container recreate — without it
    # you'd hit Let's Encrypt's rate limits on every redeploy.
    #
    # Public ingress points: 80 (ACME challenge + HTTPS redirect) and
    # 443 (the actual MCP traffic). The openbridge-mcp service no
    # longer publishes a port to the host.
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      openbridge-mcp:
        condition: service_started
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN in .env to your public hostname}
      MCP_PORT: ${MCP_PORT:-8000}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env for Let's Encrypt notifications}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  redis:
    # Redis-compatible task queue + storage backend for FastMCP background
    # tasks (via Docket: https://gofastmcp.com/servers/tasks). User chose
    # the docs-recommended Redis 7 image. The container is *not* exposed
    # to the host — only the openbridge-mcp service on the compose
    # network can reach it. AOF persistence to a named volume keeps the
    # task queue durable across container restarts.
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbridge-mcp:
    # Local: `docker compose build` then `docker compose up` uses this Dockerfile.
    # CI/registry: publish multi-arch with
    # `docker buildx build --platform linux/amd64,linux/arm64 --push` and
    # `docker compose pull` if you prefer a pre-built image instead of building.
    build:
      context: .
      dockerfile: Dockerfile
    image: openbridge-mcp:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # The application must listen on the compose network; Caddy remains
      # the only published ingress.
      MCP_HOST: 0.0.0.0
      MCP_LIMIT_CONCURRENCY: ${MCP_LIMIT_CONCURRENCY:-100}
      # Docket / FastMCP background-tasks backend. Internal compose DNS
      # resolves "redis" to the sidecar above. No public ingress.
      FASTMCP_DOCKET_URL: redis://redis:6379/0
      # FastMCP task snapshots include request headers and access tokens.
      # Require encryption because Redis persists its queue to an AOF volume.
      FASTMCP_TASKS_ENCRYPTION_KEY: ${FASTMCP_TASKS_ENCRYPTION_KEY:?set FASTMCP_TASKS_ENCRYPTION_KEY in .env}
      # AUTH_ENABLED=true always requires a verified client credential.
      # This override applies only to deliberately auth-disabled containers.
      OPENBRIDGE_ALLOW_INSECURE_REMOTE_AUTH: ${OPENBRIDGE_ALLOW_INSECURE_REMOTE_AUTH:-false}
      OPENBRIDGE_AUTH_EXCHANGE_CONCURRENCY: ${OPENBRIDGE_AUTH_EXCHANGE_CONCURRENCY:-8}
      OPENBRIDGE_ENABLE_QUERY_EXECUTION: ${OPENBRIDGE_ENABLE_QUERY_EXECUTION:-false}
      OPENBRIDGE_ENABLE_PRIVILEGED_TOOLS: ${OPENBRIDGE_ENABLE_PRIVILEGED_TOOLS:-false}
      MCP_PATH_TOKEN_ENABLED: ${MCP_PATH_TOKEN_ENABLED:-false}
      MCP_PATH_TOKEN_TTL_DAYS: ${MCP_PATH_TOKEN_TTL_DAYS:-7}
      MCP_PATH_TOKEN_MAX_AGE_DAYS: ${MCP_PATH_TOKEN_MAX_AGE_DAYS:-7}
      # The unset-variable compatibility default accepts direct Openbridge
      # JWTs and xxx:yyy API credentials through FastMCP's native verifier.
      # Set oauth_proxy for browser OAuth plus those direct Bearer flows.
      OPENBRIDGE_AUTH_MODE: ${OPENBRIDGE_AUTH_MODE:-refresh_token}
      # Required when OPENBRIDGE_AUTH_MODE=oauth_proxy: the externally-
      # reachable base URL of this server, used by FastMCP to construct the
      # OAuth redirect URI. Must match the URL clients use to reach the
      # server — set this to your public hostname when behind a reverse proxy.
      # Example: https://mcp.yourcompany.com
      # MCP_BASE_URL: ${MCP_BASE_URL:-}
      # Stable secret for signing FastMCP session tokens in oauth_proxy mode.
      # If unset, a random key is generated per process start (sessions break
      # on container restart). Set to a strong, stable secret for production.
      # MCP_JWT_SIGNING_KEY: ${MCP_JWT_SIGNING_KEY:-}
      OPENBRIDGE_OAUTH_CLIENT_ID: ${OPENBRIDGE_OAUTH_CLIENT_ID:-openbridge-mcp}
      OPENBRIDGE_OAUTH_CLIENT_SECRET: ${OPENBRIDGE_OAUTH_CLIENT_SECRET:-not-used}
      # Upstream client_id forwarded to /auth/oauth/initialize. Leave empty
      # unless instructed otherwise by Openbridge support.
      # OPENBRIDGE_OAUTH_UPSTREAM_CLIENT_ID: ${OPENBRIDGE_OAUTH_UPSTREAM_CLIENT_ID:-}
    expose:
      # Internal-only — the Caddy sidecar reverse-proxies traffic over
      # the compose network. NO `ports:` block here on purpose: openbridge-mcp
      # MUST NOT be reachable from the host or the public internet. All
      # external ingress goes through Caddy on 443.
      - "${MCP_PORT:-8000}"
    volumes:
      - type: bind
        source: .env
        target: /app/.env
        read_only: true
    restart: unless-stopped

volumes:
  redis-data:
    # Persists Redis AOF file across container recreate / image upgrade.
  caddy-data:
    # Caddy's ACME account key, issued certificates, and OCSP staples.
    # Losing this volume means re-issuing the certificate, which counts
    # against Let's Encrypt's per-domain rate limits — keep it.
  caddy-config:
    # Caddy's adapted runtime config. Less critical than caddy-data but
    # required for clean reloads.
