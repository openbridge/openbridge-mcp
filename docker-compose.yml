
services:
  redis:
    # Redis-compatible task queue + storage backend for FastMCP background
    # tasks (via Docket: https://gofastmcp.com/servers/tasks). User chose
    # the docs-recommended Redis 7 image. The container is *not* exposed
    # to the host — only the openbridge-mcp service on the compose
    # network can reach it. AOF persistence to a named volume keeps the
    # task queue durable across container restarts.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbridge-mcp:
    # Local: `docker compose build` then `docker compose up` uses this Dockerfile.
    # CI/registry: publish multi-arch with
    # `docker buildx build --platform linux/amd64,linux/arm64 --push` and
    # `docker compose pull` if you prefer a pre-built image instead of building.
    build:
      context: .
      dockerfile: Dockerfile
    image: openbridge-mcp:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Docket / FastMCP background-tasks backend. Internal compose DNS
      # resolves "redis" to the sidecar above. No public ingress.
      FASTMCP_DOCKET_URL: redis://redis:6379/0
      # Multi-tenant fail-closed by default for the production stack.
      # When this is true, requests without an Authorization: Bearer
      # header are rejected with McpError(-32001) instead of silently
      # executing as the OPENBRIDGE_REFRESH_TOKEN principal. Operators
      # running a single-tenant install can override by setting
      # OPENBRIDGE_REQUIRE_CLIENT_AUTH=false in `.env`. See README.md
      # → "Per-client authentication".
      OPENBRIDGE_REQUIRE_CLIENT_AUTH: ${OPENBRIDGE_REQUIRE_CLIENT_AUTH:-true}
      # Auth mode: "refresh_token" (default) uses the Bearer-token exchange
      # middleware. "oauth_proxy" activates FastMCP's built-in OAuthProxy,
      # which proxies the full OAuth 2.0 flow to Openbridge's auth service
      # and verifies tokens via introspection. The two modes are mutually
      # exclusive — choose one per deployment.
      OPENBRIDGE_AUTH_MODE: ${OPENBRIDGE_AUTH_MODE:-refresh_token}
      # Required when OPENBRIDGE_AUTH_MODE=oauth_proxy: the externally-
      # reachable base URL of this server, used by FastMCP to construct the
      # OAuth redirect URI. Must match the URL clients use to reach the
      # server — set this to your public hostname when behind a reverse proxy.
      # Example: https://mcp.yourcompany.com
      # MCP_BASE_URL: ${MCP_BASE_URL:-}
      # Stable secret for signing FastMCP session tokens in oauth_proxy mode.
      # If unset, a random key is generated per process start (sessions break
      # on container restart). Set to a strong, stable secret for production.
      # MCP_JWT_SIGNING_KEY: ${MCP_JWT_SIGNING_KEY:-}
      OPENBRIDGE_OAUTH_CLIENT_ID: ${OPENBRIDGE_OAUTH_CLIENT_ID:-openbridge-mcp}
      OPENBRIDGE_OAUTH_CLIENT_SECRET: ${OPENBRIDGE_OAUTH_CLIENT_SECRET:-not-used}
      # Upstream client_id forwarded to /auth/oauth/initialize. Leave empty
      # unless instructed otherwise by Openbridge support.
      # OPENBRIDGE_OAUTH_UPSTREAM_CLIENT_ID: ${OPENBRIDGE_OAUTH_UPSTREAM_CLIENT_ID:-}
    ports:
      # `main.py` binds to MCP_PORT inside the container, so both sides of
      # the mapping follow the same env var. Dockerfile EXPOSE 8000 is
      # purely informational and does not constrain the runtime bind port.
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    volumes:
      - type: bind
        source: .env
        target: /app/.env
        read_only: true
    restart: unless-stopped

volumes:
  redis-data:
    # Persists Redis AOF file across container recreate / image upgrade.
